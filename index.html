<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mangga Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red: #D6191F;
    --ink: #201C1B;
    --ink-soft: #6B6360;
    --paper: #FAF7F3;
    --card: #FFFFFF;
    --line: rgba(32,28,27,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
  }
  body{
    display:flex;
    justify-content:center;
    padding: 56px 22px 60px;
  }
  .page{
    width: 100%;
    max-width: 400px;
    text-align:center;
  }
  .avatar{
    width: 96px; height: 96px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow:hidden;
  }
  .avatar img{
    width: 100%; height: 100%;
    object-fit: cover;
  }
  h1{
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .bio{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0 0 32px;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap: 11px;
  }
  a.linkbtn{
    display:flex;
    align-items:center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 14px 17px;
    text-decoration:none;
    color: var(--ink);
    font-size: 15.5px;
    font-weight: 500;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  a.linkbtn:active{
    transform: scale(0.98);
  }
  a.linkbtn:hover{
    border-color: var(--red);
  }
  .icon{
    width: 20px; height: 20px;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:100%; height:100%; }
  .label{ flex:1; text-align:left; }
  .arrow{
    color: var(--red);
    font-size: 17px;
  }
  footer{
    margin-top: 36px;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.7;
  }
</style>
</head>
